apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            namespace: argocd
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/argocd"
                helm:
                  releaseName: argocd
                  valueFiles:
                    - "/values/argocd/secrets.sinan.yaml"
          - name: cert-manager
            namespace: cert-manager
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/cert-manager"
                helm:
                  releaseName: cert-manager
                  valueFiles: []
          - name: clickhouse
            namespace: clickhouse
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/clickhouse"
                helm:
                  releaseName: clickhouse
                  valueFiles:
                    - "values.minimal.yaml"
                    - "/values/clickhouse/values.sinan.yaml"
                    - "/values/clickhouse/secrets.sinan.yaml"
          - name: keycloak
            namespace: keycloak
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/keycloak"
                helm:
                  releaseName: keycloak
                  valueFiles:
                    - "/values/keycloak/secrets.sinan.yaml"
                    - "/values/keycloak/values.sinan.yaml"
          - name: openebs
            namespace: openebs
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/openebs"
                helm:
                  releaseName: openebs
                  valueFiles:
                    - "values.minimal.yaml"
          - name: otel
            namespace: otel
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/otel"
                helm:
                  releaseName: otel
                  valueFiles:
                    - "/values/otel/values.sinan.yaml"
                    - "/values/otel/secrets.sinan.yaml"
          - name: postgres
            namespace: postgres
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/postgres"
                helm:
                  releaseName: postgres
                  valueFiles:
                    - "values.minimal.yaml"
                    - "/values/postgres/values.sinan.yaml"
                    - "/values/postgres/secrets.sinan.yaml"
          - name: signoz
            namespace: signoz
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/signoz"
                helm:
                  releaseName: signoz
                  valueFiles:
                    - "/values/signoz/values.sinan.yaml"
                    - "/values/signoz/secrets.sinan.yaml"
          - name: valkey
            namespace: valkey
            sources:
              - repoURL: "https://github.com/sinanmohd/infra.git"
                targetRevision: HEAD
                path: "charts/valkey"
                helm:
                  releaseName: valkey
                  valueFiles: []
  template:
    metadata:
      name: "{{.name}}"
    spec:
      project: default
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true
  templatePatch: |
    spec:
      sources:
        {{- .sources | toYaml | nindent 6 }}
